# Root mise configuration for managing mage_flow and mage_vl as separate projects
# without modifying upstream pyproject.toml files.
# All inference tasks default to local/offline GPU execution.

# =============================================================================
# General / Diagnostics
# =============================================================================

[tasks.doctor]
description = "Check GPU, CUDA, uv, ffmpeg, and sub-project venv status"
run = """
echo "=== Hardware & System ==="
nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader 2>/dev/null || echo "nvidia-smi: not found"
nvcc --version 2>/dev/null | tail -n 2 || echo "nvcc: not found"
echo "uv: $(uv --version 2>/dev/null || echo 'not found')"
echo "ffmpeg: $(which ffmpeg 2>/dev/null || echo 'not found')"
echo ""
echo "=== Sub-project Virtual Environments ==="
for d in mage_flow mage_vl; do
  if [ -x "$d/.venv/bin/python" ]; then
    echo "  $d/.venv: $($d/.venv/bin/python --version)"
  else
    echo "  $d/.venv: not created"
  fi
done
"""

# =============================================================================
# mage_flow — Local text-to-image generation & image editing (Python 3.11)
# =============================================================================

[tasks."flow:setup"]
description = "Create mage_flow/.venv with pinned requirements.txt + flash-attn"
dir = "mage_flow"
run = """
set -euo pipefail
[ -d .venv ] || uv venv --python 3.11 .venv
uv pip install --python .venv/bin/python -r requirements.txt
uv pip install --python .venv/bin/python -e . --no-deps
uv pip install --python .venv/bin/python setuptools wheel ninja
TORCH_CUDA_ARCH_LIST="${TORCH_CUDA_ARCH_LIST:-$(nvidia-smi --query-gpu=compute_cap --format=csv,noheader | sort -u | paste -sd';' -)}"
FLASH_ATTN_CUDA_ARCHS="${FLASH_ATTN_CUDA_ARCHS:-$(nvidia-smi --query-gpu=compute_cap --format=csv,noheader | tr -d '.' | sed 's/^8[69]$/80/' | sort -u | paste -sd';' -)}"
echo "Target GPU arch: TORCH_CUDA_ARCH_LIST=$TORCH_CUDA_ARCH_LIST, FLASH_ATTN_CUDA_ARCHS=$FLASH_ATTN_CUDA_ARCHS"
FLASH_ATTENTION_FORCE_BUILD=TRUE FLASH_ATTN_CUDA_ARCHS="$FLASH_ATTN_CUDA_ARCHS" TORCH_CUDA_ARCH_LIST="$TORCH_CUDA_ARCH_LIST" MAX_JOBS=4 \
  uv pip install --python .venv/bin/python --no-build-isolation --no-deps flash-attn==2.8.3
"""

[tasks."flow:app"]
description = "Launch Mage-Flow local Gradio web UI (pass extra args after --)"
dir = "mage_flow"
run = ".venv/bin/mage-flow-app"

[tasks."flow:gen"]
description = "Run Mage-Flow local text-to-image CLI (pass args after --)"
dir = "mage_flow"
run = ".venv/bin/mage-flow"

[tasks."flow:edit"]
description = "Run Mage-Flow local image editing CLI (pass args after --)"
dir = "mage_flow"
run = ".venv/bin/mage-flow-edit"

# =============================================================================
# mage_vl — Local/offline image/video understanding & streaming (Python 3.11)
# =============================================================================

[tasks."vl:setup"]
description = "Create mage_vl/.venv with torch 2.13, transformers 5.7.0, flash-attn & mamba-ssm"
dir = "mage_vl"
run = """
set -euo pipefail
[ -d .venv ] || uv venv --python 3.11 .venv
# Pin torch<=2.13 so flash-attn (-std=c++17) compiles cleanly (torch 2.15+ headers require C++20),
# and pin transformers==5.7.0 to match microsoft/Mage-VL's bundled modeling_mage_vl.py.
uv pip install --python .venv/bin/python "torch==2.13.0" "torchvision==0.28.0" "transformers==5.7.0"
grep -Ev '^(torch|torchvision|transformers|flash-attn|mamba-ssm)' requirements.txt > /tmp/mage_vl_base_reqs.txt
uv pip install --python .venv/bin/python -r /tmp/mage_vl_base_reqs.txt
rm -f /tmp/mage_vl_base_reqs.txt
uv pip install --python .venv/bin/python setuptools wheel ninja einops
# Build CUDA extensions sequentially with MAX_JOBS=4 to keep RAM usage reasonable.
# Auto-detect GPU compute capability (e.g. A5000 -> 8.6 / 80, RTX 5080/5060 -> 12.0 / 120).
TORCH_CUDA_ARCH_LIST="${TORCH_CUDA_ARCH_LIST:-$(nvidia-smi --query-gpu=compute_cap --format=csv,noheader | sort -u | paste -sd';' -)}"
FLASH_ATTN_CUDA_ARCHS="${FLASH_ATTN_CUDA_ARCHS:-$(nvidia-smi --query-gpu=compute_cap --format=csv,noheader | tr -d '.' | sed 's/^8[69]$/80/' | sort -u | paste -sd';' -)}"
echo "Target GPU arch: TORCH_CUDA_ARCH_LIST=$TORCH_CUDA_ARCH_LIST, FLASH_ATTN_CUDA_ARCHS=$FLASH_ATTN_CUDA_ARCHS"
FLASH_ATTENTION_FORCE_BUILD=TRUE FLASH_ATTN_CUDA_ARCHS="$FLASH_ATTN_CUDA_ARCHS" TORCH_CUDA_ARCH_LIST="$TORCH_CUDA_ARCH_LIST" MAX_JOBS=4 \
  uv pip install --python .venv/bin/python --no-build-isolation --no-deps "flash-attn==2.8.3"
MAMBA_FORCE_BUILD=TRUE TORCH_CUDA_ARCH_LIST="$TORCH_CUDA_ARCH_LIST" MAX_JOBS=4 \
  uv pip install --python .venv/bin/python --no-build-isolation --no-deps "mamba-ssm>=2.2"
"""

[tasks."vl:download"]
description = "Download microsoft/Mage-VL locally to models/Mage-VL for fully offline runs"
dir = "mage_vl"
run = '.venv/bin/hf download microsoft/Mage-VL --local-dir ../models/Mage-VL'

[tasks."vl:infer"]
description = "Run Mage-VL offline/local inference (pass --image/--video and --question after --)"
dir = "mage_vl"
run = """
MODEL="${MAGE_VL_MODEL:-$([ -d ../models/Mage-VL ] && echo ../models/Mage-VL || echo microsoft/Mage-VL)}"
.venv/bin/python inference_base.py --mode offline --model "$MODEL" "$@"
"""

[tasks."vl:stream"]
description = "Run Mage-VL offline/local event-gated streaming inference (pass --video etc. after --)"
dir = "mage_vl"
run = """
MODEL="${MAGE_VL_MODEL:-$([ -d ../models/Mage-VL ] && echo ../models/Mage-VL || echo microsoft/Mage-VL)}"
.venv/bin/python inference_streaming.py --checkpoint "$MODEL" "$@"
"""

[tasks."vl:demo-image"]
description = "Quick Mage-VL offline image demo using bundled dog.jpg"
dir = "mage_vl"
run = """
MODEL="${MAGE_VL_MODEL:-$([ -d ../models/Mage-VL ] && echo ../models/Mage-VL || echo microsoft/Mage-VL)}"
.venv/bin/python inference_base.py --mode offline --model "$MODEL" --image assets/examples/dog.jpg --question "Describe this image in detail."
"""

[tasks."vl:demo-video"]
description = "Quick Mage-VL offline codec video demo using bundled soccer-broadcast.mp4"
dir = "mage_vl"
run = """
MODEL="${MAGE_VL_MODEL:-$([ -d ../models/Mage-VL ] && echo ../models/Mage-VL || echo microsoft/Mage-VL)}"
.venv/bin/python inference_base.py --mode offline --model "$MODEL" --video assets/examples/soccer-broadcast.mp4 --video-backend codec --codec-engine traditional --num-frames 32 --question "Describe this video."
"""
